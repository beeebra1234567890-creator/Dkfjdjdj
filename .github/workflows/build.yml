
name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unzip project
        id: project
        run: |
          set -e
          ZIP=$(find . -maxdepth 1 -name '*.zip' -print -quit)
          test -n "$ZIP"
          mkdir -p /tmp/rentvpn
          unzip -q -o "$ZIP" -d /tmp/rentvpn
          SETTINGS=$(find /tmp/rentvpn -name settings.gradle.kts -print -quit)
          test -n "$SETTINGS"
          echo "dir=$(dirname "$SETTINGS")" >> "$GITHUB_OUTPUT"

      - name: Download Xray library
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          LIB="${{ steps.project.outputs.dir }}/app/libs"
          mkdir -p "$LIB"
          gh release download --repo 2dust/AndroidLibXrayLite \
            --pattern '*.aar' --dir "$LIB" --clobber
          A=$(find "$LIB" -name '*.aar' -print -quit)
          test -n "$A"
          mv "$A" "$LIB/libv2ray.aar"

      - name: Build APK
        run: |
          set -e
          gradle -p "${{ steps.project.outputs.dir }}" :app:assembleDebug
          cp "${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk" RentVPN.apk

      - uses: actions/upload-artifact@v4
        with:
          name: RENT-VPN-debug-apk
          path: RentVPN.apk

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rentvpn-build-${{ github.run_number }}
          name: RentVPN build ${{ github.run_number }}
          files: RentVPN.apk
          
