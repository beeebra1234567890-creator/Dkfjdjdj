
name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find project
        id: project
        run: |
          F=$(find . -name settings.gradle.kts -print -quit)
          test -n "$F"
          echo "dir=$(dirname "$F")" >> "$GITHUB_OUTPUT"

      - name: Download Xray
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "${{ steps.project.outputs.dir }}/app/libs"
          gh release download --repo 2dust/AndroidLibXrayLite \
            --pattern '*.aar' \
            --dir "${{ steps.project.outputs.dir }}/app/libs"
          A=$(find "${{ steps.project.outputs.dir }}/app/libs" -name '*.aar' | head -1)
          test -n "$A"
          mv "$A" "${{ steps.project.outputs.dir }}/app/libs/libv2ray.aar"

      - name: Build APK
        run: |
          gradle -p "${{ steps.project.outputs.dir }}" :app:assembleDebug
          cp "${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk" RentVPN.apk

      - uses: actions/upload-artifact@v4
        with:
          name: RENT-VPN-debug-apk
          path: RentVPN.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: rentvpn-build-${{ github.run_number }}
          name: RentVPN build ${{ github.run_number }}
          files: RentVPN.apk
          
